name: Prüfungen
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  crew:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Syntax prüfen
        run: |
          for source in *.js test/*.js scripts/*.mjs; do
            node --check "$source"
          done
      - name: Crew prüfen
        env:
          TZ: Europe/Berlin
        run: npm test
      - name: HTTPS-Proxy und Registrierung prüfen
        run: node scripts/check-proxy.mjs
      - name: Codegröße und Abstandsraster prüfen
        run: |
          npm ci
          npm run lint
      - name: Browser bereitstellen
        run: npx playwright install --with-deps chromium webkit
      - name: Bedienung in Chromium prüfen
        env:
          TZ: Europe/Berlin
        run: npm run test:browser
      - name: Bedienung in WebKit prüfen
        env:
          TZ: Europe/Berlin
          CREW_BROWSER_ENGINE: webkit
        run: npm run test:browser
      - name: Ansichten bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: crew-ansichten
          path: build/screenshots/*.png
      - name: WebKit-Ansichten bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: crew-ansichten-webkit
          path: build/webkit/*.png
      - name: Container bauen
        run: docker build -t crew-ci .
      - name: Sicherung und Wiederherstellung prüfen
        run: node scripts/check-restore.mjs
      - name: Quellpaket prüfen
        run: |
          set -euo pipefail
          python3 scripts/package-release-source.py "$GITHUB_SHA" "$RUNNER_TEMP/crew-source"
          bash scripts/check-release-source.sh "$RUNNER_TEMP"/crew-source/crew-*
