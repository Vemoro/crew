name: Prüfungen
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  crew:
    runs-on: ubuntu-latest
    env:
      CREW_TEST_DATABASE_URL: postgres://postgres:synthetic-ci-test@127.0.0.1:5432/postgres
      TZ: Europe/Berlin
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: synthetic-ci-test
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.5'
      - name: Abhängigkeiten, Build und Typprüfung
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run typecheck
      - name: Crew prüfen
        run: bun run test
      - name: Codegröße und Abstandsraster prüfen
        run: bun run lint
      - name: Browser bereitstellen
        run: bunx playwright install --with-deps chromium webkit
      - name: Bedienung in Chromium prüfen
        run: bun run test:browser
      - name: Bedienung in WebKit prüfen
        env:
          CREW_BROWSER_ENGINE: webkit
        run: bun run test:browser
      - name: Ansichten bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: crew-ansichten
          path: build/screenshots/*.png
      - name: WebKit-Ansichten bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: crew-ansichten-webkit
          path: build/webkit/*.png
      - name: Container bauen
        run: docker build -t crew-ci .
      - name: Sicherung und Wiederherstellung prüfen
        run: bun scripts/check-restore.mjs
      - name: Quellpaket prüfen
        run: |
          set -euo pipefail
          python3 scripts/package-release-source.py "$GITHUB_SHA" "$RUNNER_TEMP/crew-source"
          bash scripts/check-release-source.sh "$RUNNER_TEMP"/crew-source/crew-*
