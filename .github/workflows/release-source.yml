name: Privates Quellpaket prüfen
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    if: github.event.repository.private && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Quellen und Prüfsumme erstellen
        run: python3 scripts/package-release-source.py "$GITHUB_SHA" "$RUNNER_TEMP/crew-source"
      - name: Installation aus dem Quellpaket prüfen
        run: |
          set -euo pipefail
          package="$(find "$RUNNER_TEMP/crew-source" -mindepth 1 -maxdepth 1 -type d)"
          bash scripts/check-release-source.sh "$package"
      - uses: actions/upload-artifact@v4
        with:
          name: crew-quellpaket
          path: ${{ runner.temp }}/crew-source/**/*
          if-no-files-found: error
